name: simple-local
description: Single-node, all-Ollama pipeline for quick local testing — no cloud API keys needed
version: 2

execution:
  model_timeout_seconds: 60
history:
  max_turns: 0

nodes:
  - id: clasify
    depends_on: []
    model:
      provider: ollama
      name: llama3
      temperature: 0.0
    system_prompt: classify input into 3 categories. "JOKE", "STORY", "OTHER". Use only these three words.
    prompt_template: '{{ input }}'
    layout:
      x: 22.0
      y: 232.0
  - id: joke
    depends_on: []
    model:
      provider: ollama
      name: llama3
      temperature: 0.3
    prompt_template: |2

      {{ input }}
    layout:
      x: -252.0
      y: 441.0
    system_prompt: if input contains "JOKE" tell a joke, otherwise dont do anything.
  - id: story
    depends_on: []
    model:
      provider: ollama
      name: llama3
      temperature: 0.3
    system_prompt: if input contains "STORY" tell a brief story, otherwise dont do anything.
    prompt_template: |2

      "Answer"
      {{ input }}
    layout:
      x: 24.0
      y: 440.0
  - id: other
    depends_on: []
    model:
      provider: ollama
      name: llama3
      temperature: 0.3
    system_prompt: if input contains "OTHER" answer user question, otherwise dont do anything.
    prompt_template: |2

      Answer:
      {{ input }}
    layout:
      x: 295.0
      y: 444.0
output_nodes: [other]
branches:
  - id: clasify_route
    from: clasify
    routes:
      - when: '"JOKE" in output'
        to: joke
      - when: '"STORY" in output'
        to: story
      - default: true
        to: other
