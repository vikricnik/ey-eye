name: my-pipeline1
version: 2
execution:
  model_timeout_seconds: 60.0
  max_retries: 1
  retry_backoff_seconds: 1.0
history:
  max_turns: 0
nodes:
  - id: answer
    depends_on: []
    model:
      provider: ollama
      name: codegemma:2b
      temperature: 0.3
    prompt_template: '{{ input }}'
    layout:
      x: 0.0
      y: 0.0
  - id: node
    depends_on: []
    model:
      provider: ollama
      name: gpt-oss:20b
      temperature: 0.3
    prompt_template: '{{ input }}'
    include_history: false
    layout:
      x: -289.0
      y: -1.0
  - id: node_2
    depends_on: []
    model:
      provider: ollama
      name: starcoder2:7b
      temperature: 0.3
    prompt_template: |+
      {{ input }}

    layout:
      x: 276.0
      y: 0.0
  - id: node_3
    depends_on:
      - node_2
      - node
      - answer
    model:
      provider: ollama
      name: qwen3:14b
      temperature: 0.3
    prompt_template: |-
      {{ node_2.output }}
      {{ answer.output }}
      {{ node.output }}

      {{ input }}
    layout:
      x: 0.0
      y: 170.0
output_nodes: [node_3]
