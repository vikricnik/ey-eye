[tool.poetry]
name = "llm-pipeline"
version = "0.1.0"
description = "Multi-tier LLM orchestration with FastAPI + LangGraph + Ollama"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "llm_pipeline" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
langgraph = "^0.2.60"
langchain-ollama = "^0.2.0"
langchain-core = "^0.3.21"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
langchain-openai = { version = "^0.2.0", optional = true }
langchain-anthropic = { version = "^0.3.0", optional = true }
langchain-google-genai = { version = "^2.0.0", optional = true }

[tool.poetry.extras]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
gemini = ["langchain-google-genai"]
all-providers = ["langchain-openai", "langchain-anthropic", "langchain-google-genai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_ollama.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
