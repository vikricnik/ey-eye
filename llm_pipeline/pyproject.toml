[tool.poetry]
name = "llm-pipeline"
version = "0.1.0"
description = "Multi-tier LLM orchestration with FastAPI + LangGraph + Ollama"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "llm_pipeline" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
langgraph = "^0.2.60"
langchain-ollama = "^0.2.0"
langchain-core = "^0.3.21"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
pyyaml = "^6.0.2"
jinja2 = "^3.1.4"
langchain-openai = { version = "^0.2.0", optional = true }
langchain-anthropic = { version = "^0.3.0", optional = true }
langchain-google-genai = { version = "^2.0.0", optional = true }

[tool.poetry.extras]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
gemini = ["langchain-google-genai"]
all-providers = ["langchain-openai", "langchain-anthropic", "langchain-google-genai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
mypy = "^1.13.0"
types-pyyaml = "^6.0.12"
pyright = "^1.1.390"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# NOTE: ignore_missing_imports only has an effect when a module can't be
# resolved at all — if it resolves successfully with its own working type
# stubs (as langgraph does once properly installed), this override is a
# harmless no-op and full type checking proceeds normally against the
# real signatures. Kept as a defensive fallback either way.
[[tool.mypy.overrides]]
module = "jinja2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_ollama.*"
ignore_missing_imports = true

# These three are OPTIONAL dependencies (only installed via `poetry install
# --extras ...`), imported lazily inside providers.py's OpenAIProvider /
# AnthropicProvider / GeminiProvider classes. Without these overrides, mypy
# fails on a plain `poetry install` (no extras) with "Cannot find
# implementation or library stub" for each — regardless of whether the
# import is lazy/local, mypy still resolves every reachable import statement.
[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_google_genai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyright]
include = ["llm_pipeline", "tests"]
pythonVersion = "3.11"
# Matches mypy's `strict = true` in spirit. The two tools use different
# type-checking algorithms and occasionally disagree — that disagreement is
# useful signal on its own, not a bug to resolve by loosening one of them.
typeCheckingMode = "strict"

# Relaxed from strict-mode defaults. These specifically fire when a type
# traces back to a third-party surface that's partially typed or
# intentionally unresolved — LangGraph's heavily-overloaded, generic
# add_node/compile signatures (its own types include `Unknown` fallbacks
# pyright can't fully resolve), and the three OPTIONAL cloud provider SDKs
# (langchain_openai/anthropic/google_genai), unresolved by design when
# their extras aren't installed. They're about inference COMPLETENESS at a
# third-party interop boundary, not real type-safety bugs in this
# codebase's own code — every genuine mismatch WE introduce is still caught
# by the rest of strict mode (reportArgumentType, reportCallIssue,
# reportAssignmentType, etc.), which all remain fully active.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
# Bare lambdas (used for concise test mocks, e.g.
# `monkeypatch.setattr(x, "y", lambda spec: ...)`) can't carry parameter
# type annotations at all — Python's lambda syntax doesn't support them —
# so this would otherwise fire on every mocked lambda in the test suite.
reportUnknownLambdaType = false

# Deliberately NOT setting venvPath/venv here: that only makes sense if
# Poetry creates the virtualenv inside this project folder, which depends
# on `virtualenvs.in-project` being enabled — true in the Docker build (see
# Dockerfile), but not guaranteed for your local Poetry config. Running via
# `poetry run pyright` already activates the correct interpreter without
# needing this; for VSCode/Pylance, select the Poetry-managed interpreter
# explicitly instead (see README) rather than relying on this config to
# guess its location.

# NOTE on the three optional cloud provider imports (langchain_openai,
# langchain_anthropic, langchain_google_genai) in providers.py: unlike
# mypy's per-module `ignore_missing_imports` overrides above, pyright has
# no equivalent per-module config for "this import is allowed to be
# missing." Those three import lines carry an inline
# `# pyright: ignore[reportMissingImports]` comment instead — deliberately
# NOT a plain `# type: ignore`, since mypy already tolerates those imports
# via its overrides above, and a redundant `# type: ignore` there would
# trip mypy's own `warn_unused_ignores`. Using pyright's own comment syntax
# means each tool only reacts to the suppression meant for it.
