[project]
name = "llm-pipeline"
version = "0.1.0"
description = "Multi-tier LLM orchestration with FastAPI + LangGraph + Ollama"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "langgraph>=0.2.60,<0.3.0",
    "langchain-ollama>=0.2.0,<0.3.0",
    "langchain-core>=0.3.21,<0.4.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "jinja2>=3.1.4,<4.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0,<0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0,<0.4.0"]
gemini = ["langchain-google-genai>=2.0.0,<3.0.0"]
all-providers = [
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.3.0,<0.4.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
    "mypy>=1.13.0,<2.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
    "pyright>=1.1.390,<2.0.0",
    "ruff>=0.8.0,<0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# NOTE: ignore_missing_imports only has an effect when a module can't be
# resolved at all — if it resolves successfully with its own working type
# stubs (as langgraph does once properly installed), this override is a
# harmless no-op and full type checking proceeds normally against the
# real signatures. Kept as a defensive fallback either way.
[[tool.mypy.overrides]]
module = "jinja2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_ollama.*"
ignore_missing_imports = true

# These three are OPTIONAL dependencies (only installed via `uv sync
# --extra ...`), imported lazily inside providers/openai.py, anthropic.py,
# and gemini.py's adapter classes. Without these overrides, mypy fails on a
# plain `uv sync` (no extras) with "Cannot find implementation or
# library stub" for each — regardless of whether the import is lazy/local,
# mypy still resolves every reachable import statement.
[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_google_genai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyright]
include = ["llm_pipeline", "tests"]
pythonVersion = "3.11"
# Matches mypy's `strict = true` in spirit. The two tools use different
# type-checking algorithms and occasionally disagree — that disagreement is
# useful signal on its own, not a bug to resolve by loosening one of them.
typeCheckingMode = "strict"

# Relaxed from strict-mode defaults. These specifically fire when a type
# traces back to a third-party surface that's partially typed or
# intentionally unresolved — LangGraph's heavily-overloaded, generic
# add_node/compile signatures (its own types include `Unknown` fallbacks
# pyright can't fully resolve), and the three OPTIONAL cloud provider SDKs
# (langchain_openai/anthropic/google_genai), unresolved by design when
# their extras aren't installed. They're about inference COMPLETENESS at a
# third-party interop boundary, not real type-safety bugs in this
# codebase's own code — every genuine mismatch WE introduce is still caught
# by the rest of strict mode (reportArgumentType, reportCallIssue,
# reportAssignmentType, etc.), which all remain fully active.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
# Bare lambdas (used for concise test mocks, e.g.
# `monkeypatch.setattr(x, "y", lambda spec: ...)`) can't carry parameter
# type annotations at all — Python's lambda syntax doesn't support them —
# so this would otherwise fire on every mocked lambda in the test suite.
reportUnknownLambdaType = false

# Deliberately NOT setting venvPath/venv here: `uv run pyright` already
# activates the correct interpreter without needing this. uv always creates
# its virtualenv at `.venv` inside the project folder, so for VSCode/Pylance
# just select that interpreter directly (see README) rather than relying on
# this config to guess its location.

# NOTE on the three optional cloud provider imports (langchain_openai,
# langchain_anthropic, langchain_google_genai) in providers/openai.py,
# anthropic.py, gemini.py: unlike mypy's per-module `ignore_missing_imports`
# overrides above, pyright has no equivalent per-module config for "this
# import is allowed to be missing." Those three import lines carry an inline
# `# pyright: ignore[reportMissingImports]` comment instead — deliberately
# NOT a plain `# type: ignore`, since mypy already tolerates those imports
# via its overrides above, and a redundant `# type: ignore` there would
# trip mypy's own `warn_unused_ignores`. Using pyright's own comment syntax
# means each tool only reacts to the suppression meant for it.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pipelines"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — unused imports/variables, undefined names
    "I",    # isort — import sorting/grouping
    "UP",   # pyupgrade — modernize syntax for the target Python version
    "B",    # flake8-bugbear — common bug-prone patterns
    "C4",   # flake8-comprehensions — unnecessary comprehension patterns
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    # Deliberately does NOT include any ANN (flake8-annotations) rules —
    # mypy --strict and pyright (both already in this project) already
    # enforce complete type annotations far more thoroughly than ruff's
    # annotation checks do; adding ANN here would be pure duplication.
]

[tool.ruff.lint.flake8-bugbear]
# B008 normally flags any function call used as a default argument value
# (the classic "mutable default argument" gotcha, extended to any call).
# FastAPI's own recommended dependency-injection pattern is EXACTLY this
# shape — `def endpoint(x: X = Depends(get_x)):` — and relies on FastAPI
# evaluating each Depends() call per-request rather than once at
# def-time, which is precisely what makes it safe here despite the
# general pattern being risky elsewhere. Without this, B008 would fire on
# every dependency-injected endpoint parameter in routers/health.py and
# routers/ask.py, and on every Header()-based parameter in auth.py and
# rate_limit.py.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Nothing needed yet — checked against the actual test suite (every
# pytest.raises() call already names a specific exception type, no broad
# `except Exception` patterns exist) rather than adding a speculative
# exception preemptively. Add entries here if/when a real one is needed.

[tool.ruff.format]
# Not currently enforced in CI (see ci.yml) — `ruff check` runs, `ruff
# format --check` doesn't, since this codebase predates ruff and hasn't
# had a full formatting pass run against it yet. Safe to add once that's
# been done once, since after that it's a no-op maintenance guard.
