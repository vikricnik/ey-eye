name: branch-two-defaults
version: 2

nodes:
  - id: classify
    depends_on: []
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ input }}"

  - id: path_a
    depends_on: []
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ input }}"

  - id: path_b
    depends_on: []
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ input }}"

branches:
  - id: branch1
    from: classify
    routes:
      - default: true
        to: path_a
      - default: true
        to: path_b

output_nodes: [path_a, path_b]
