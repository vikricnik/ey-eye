name: loop-bad-back-to
version: 2

nodes:
  - id: generate
    depends_on: []
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ input }}"

  - id: critique
    depends_on: [generate]
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ generate.output }}"

loops:
  - id: loop1
    from: critique
    back_to: does_not_exist
    exit_to: END
    exit_when: 'output.startswith("APPROVE")'

output_nodes: [generate]
