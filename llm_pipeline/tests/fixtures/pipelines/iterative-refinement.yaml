name: iterative-refinement
description: Generate a draft, critique it, and loop back to revise up to 3 times before finalizing
version: 1

execution:
  model_timeout_seconds: 60
  max_history_turns: 4

nodes:
  - id: generate
    depends_on: []
    model: { provider: ollama, model: llama3, temperature: 0.4 }
    prompt_template: |
      {{ input }}
      {% if critique is defined %}

      Revise your previous answer based on this critique: {{ critique.output }}
      {% endif %}

  - id: critique
    depends_on: [generate]
    model: { provider: ollama, model: llama3.2:3b, temperature: 0.0 }
    prompt_template: |
      Review this answer: {{ generate.output }}

      If it's good enough, reply with exactly the word APPROVE and nothing else.
      Otherwise, reply "REVISE: <specific, actionable feedback>".

loops:
  - id: revise_until_approved
    from: critique
    back_to: generate
    exit_to: END
    exit_when: 'output.startswith("APPROVE")'
    max_iterations: 3
    on_max_iterations: proceed

# output_node is `generate`, not `critique` — critique's own text is just
# "APPROVE" or "REVISE: ...", the actual answer lives in generate's latest
# output. Since node_outputs holds only the LATEST result per node id,
# generate's entry is automatically its most-revised version by the time
# the loop exits, regardless of how many iterations happened.
output_node: generate
