name: diamond
description: A -> (B, C) -> D
version: 2

nodes:
  - id: A
    depends_on: []
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ input }}"

  - id: B
    depends_on: [A]
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ A.output }}"

  - id: C
    depends_on: [A]
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ A.output }}"

  - id: D
    depends_on: [B, C]
    model: { provider: ollama, name: test-model }
    prompt_template: "{{ B.output }} {{ C.output }}"

output_nodes: [D]
