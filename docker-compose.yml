services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Match this to how many Ollama-backed nodes might run concurrently
    # across your pipelines (see llm_pipeline/README.md) — e.g.
    # consensus-qa.yaml has 3 parallel Ollama-backed root nodes.
    environment:
      OLLAMA_MAX_LOADED_MODELS: "3"

  pipeline-server:
    build:
      context: ./llm_pipeline
      dockerfile: Dockerfile
      # Uncomment to bake in cloud provider support:
      # args:
      #   UV_EXTRAS: "openai anthropic gemini"
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      PIPELINES_DIR: "pipelines"
      DEFAULT_PIPELINE_NAME: "simple-local"
      # The web client (8080) and the Vite dev server (5173). Must not be "*"
      # while editing is on without API_KEYS — the server refuses writes then,
      # since any website could otherwise rewrite pipelines through the browser.
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5173"
      # Set a real value before exposing this beyond localhost — see
      # llm_pipeline/.env.example for the full auth explanation.
      API_KEYS: ""
      RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
      VALIDATE_PIPELINES_ON_STARTUP: "true"
      # Lets the web editor and CLI save pipelines/presets. Saves land in the
      # mounted ./llm_pipeline/pipelines and ./llm_pipeline/presets folders
      # below, so they survive container rebuilds. Set API_KEYS too before
      # exposing this beyond your machine.
      PIPELINE_EDITING_ENABLED: "true"
      PRESETS_DIR: "presets"
      # Uncomment and set if any pipeline YAML references cloud providers:
      # OPENAI_API_KEY: ""
      # ANTHROPIC_API_KEY: ""
      # GOOGLE_API_KEY: ""
    volumes:
      - ./llm_pipeline/pipelines:/app/pipelines
      - ./llm_pipeline/presets:/app/presets
    depends_on:
      - ollama

  web:
    build:
      # Repo root, so the build can see the shared packages/client workspace.
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    environment:
      # IMPORTANT: this must be a URL reachable from the USER'S BROWSER
      # (the host machine), not the internal Docker network — the web
      # client's JS runs client-side, not inside this container. That means
      # "http://pipeline-server:8000" (the internal service name) will NOT
      # work here even though these two containers can reach each other
      # directly; use the pipeline-server's PUBLISHED host port instead,
      # matching the "8000:8000" mapping above.
      PIPELINE_BASE_URL: "http://localhost:8000"
      # Only needed if pipeline-server's API_KEYS is set. Note this value
      # is visible to anyone with browser devtools open — see web/README.md.
      PIPELINE_API_KEY: ""
    depends_on:
      - pipeline-server

volumes:
  ollama-models:
