name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-server:
    name: Python — lint (ruff), typecheck (mypy + pyright), test, validate pipelines
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "llm_pipeline/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        # Deliberately no --all-extras: mirrors a plain `poetry install` with
        # no extras, which is exactly why the three optional cloud provider
        # SDKs need mypy/pyright ignore_missing_imports overrides in
        # pyproject.toml — they're intentionally absent here.
        run: uv sync --locked

      - name: ruff check
        # Runs first and fast — catches unused imports, import-order
        # issues, and common bug-prone patterns (flake8-bugbear) before
        # spending time on the two slower type checkers below. Not a
        # replacement for mypy/pyright: ruff's own annotation-completeness
        # rules (ANN) are deliberately excluded from this project's config
        # since mypy --strict and pyright already cover that far more
        # thoroughly — ruff here is for everything neither type checker
        # looks at (import hygiene, common bug patterns, style).
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy llm_pipeline/

      - name: pyright --strict
        # Complements mypy rather than replacing it — different type-checking
        # algorithm, occasionally disagrees, both signals are useful. This is
        # also what VSCode/Pylance uses live in the editor (see pyrightconfig
        # in pyproject.toml), so this CI step keeps that in sync with what
        # the editor already shows locally.
        run: uv run pyright

      - name: pytest
        run: uv run pytest -v

      - name: Validate every pipeline YAML file
        # Same check test_pipeline_config.py's test_real_pipeline_examples_are_valid
        # runs, but as an explicit standalone step so a broken pipeline file
        # fails CI with an unambiguous, dedicated log section rather than
        # only showing up as one assertion among many in the pytest run.
        run: |
          uv run python -c "
          from pathlib import Path
          from llm_pipeline.pipeline_config import load_pipeline_definition

          pipelines_dir = Path('pipelines')
          failures = []
          for yaml_path in sorted(pipelines_dir.glob('*.yaml')):
              try:
                  definition = load_pipeline_definition(yaml_path)
                  print(f'OK: {yaml_path.name} -> {definition.name}')
              except Exception as e:
                  failures.append((yaml_path.name, e))
                  print(f'FAILED: {yaml_path.name} -> {e}')

          if failures:
              raise SystemExit(f'{len(failures)} pipeline(s) failed validation')
          "

  cli-client:
    name: CLI client — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  web-client:
    name: Web client — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit
